<!DOCTYPE html><html lang="ja"><head>
  <meta charset="utf-8"><title>Feelnote QR Login</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>#reader{width:260px;margin:auto}</style>
</head><body>
  <h3>QR をかざしてください</h3>
  <div id="reader"></div><p id="msg">待機中…</p>
  <script>
    const scanner = new Html5QrcodeScanner('reader',{fps:10,qrbbox:250});
    scanner.render((url)=>{document.getElementById('msg').textContent='遷移します…';location.href=url;});
  </script>
</body></html>
